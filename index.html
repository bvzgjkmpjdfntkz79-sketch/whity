<!DOCTYPE html>
<html>
  <head>
    <title>сайт вайти</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
  body {
    font-family: arial;
    color: #A52A2A;
    background-color: #FFDAB9;
    padding: 40px;
    .container {
    max-width: 600px; /* Ширина текста не больше 600 пикселей */
    margin: 0 auto; /* Центрируем этот блок на экране */
    background-color: white; /* Белая подложка, чтобы текст не сливался с фоном */
    padding: 30px; /* Внутренние отступы внутри белой карточки */
    border-radius: 15px; /* Закругленные углы */
    box-shadow: 0 4px 10px rgba(0,0,0,0.1); /* Легкая тень для объема */
}
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Привет!</h1>
    <p>Мой первый сайт. Круто, да?</p>
    <p>Здесь будут разные рецепты. Наверное.</p>
    </div>
  </body>
</html>
